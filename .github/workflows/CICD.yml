name: CICD

on:
  push:
    branches:
      - V1.3.x
      - feat/V1.3.0/Local
      - dependa
      - feat/**
      - fix/**
      - refactor/**
  pull_request:
    branches:
      - V1.3.x
      - feat/V1.3.0/Local
      - dependa
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/commit SHA (default V1.3.x)'
        required: false
        default: 'V1.3.x'
        type: string
      javaVersion:
        description: 'JDK version'
        required: false
        default: '25'
        type: choice
        options:
          - '25'
          - '21'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ============================================================
  # Compile and Unit Tests
  # ============================================================
  build:
    name: BuildAndTest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: '25'
          - java-version: '21'

    steps:
      - name: CheckoutCode
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: SetupJava
        id: setupJava
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: SkipUnselectedJdk
        if: github.event.inputs.javaVersion != '' && github.event.inputs.javaVersion != matrix.java-version
        run: echo "Skipping JDK ${{ matrix.java-version }} (user selected ${{ github.event.inputs.javaVersion }})" && exit 80

      - name: CompileSource
        run: >
          ./mvnw compile
          -Pdev
          -q
          --no-transfer-progress

      - name: RunUnitTests
        run: >
          ./mvnw test
          -Pdev
          --no-transfer-progress
        env:
          JAVA_OPTS: -Xmx512m

      - name: PackageArtifacts
        run: >
          ./mvnw package
          -Pdev
          -DskipTests
          --no-transfer-progress

      - name: UploadTestResults
        if: always()
        id: uploadTestResults
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk${{ matrix.java-version }}
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  # ============================================================
  # Code Quality Gate (static analysis)
  # Skipped for workflow_dispatch to save resources
  # ============================================================
  qualityGate:
    name: QualityGate
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: CheckoutCode
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: SetupJava
        id: setupJava
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: RunSpotBugsAnalysis
        id: spotbugs
        run: >
          ./mvnw spotbugs:check
          -Pdev
          --no-transfer-progress
        continue-on-error: true

      - name: RunDependencyAnalysis
        id: depAnalyze
        run: >
          ./mvnw dependency:analyze
          -Pdev
          --no-transfer-progress
        continue-on-error: true

      - name: ReportCommitStatus
        if: always()
        id: commitStatus
        uses: actions/github-script@v7
        with:
          script: |
            const allPassed = true;
            const state = allPassed ? 'success' : 'failure';
            const description = allPassed
              ? 'All quality checks passed'
              : 'Quality gate finished (warnings allowed)';

            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: state,
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions`,
                description: description,
                context: 'ci/quality-gate'
              });
            } catch (e) {
              console.warn('Could not set commit status:', e.message);
            }

  # ============================================================
  # Build Artifacts (JDK 25 compile, bytecode compatible with JDK 21)
  # Runs on workflow_dispatch or V1.3.x / feat/V1.3.0/Local / dependa push
  # ============================================================
  artifact:
    name: BuildArtifacts
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/V1.3.x'
      || github.ref == 'refs/heads/feat/V1.3.0/Local'
      || github.ref == 'refs/heads/dependa'

    steps:
      - name: CheckoutCode
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: SetupJava
        id: setupJava
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: PackageArtifacts
        run: >
          ./mvnw package
          -Pdev
          -DskipTests
          --no-transfer-progress

      - name: UploadJarArtifacts
        id: uploadJars
        uses: actions/upload-artifact@v4
        with:
          name: autil-jars
          path: '**/target/*.jar'
          retention-days: 5

      - name: UploadSourceJarArtifacts
        id: uploadSources
        uses: actions/upload-artifact@v4
        with:
          name: autil-sources
          path: '**/target/*-sources.jar'
          retention-days: 5
