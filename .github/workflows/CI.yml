name: CI

on:
  push:
    branches:
      - V1.3.x
      - feat/V1.3.0/Local
      - feat/**
      - fix/**
      - refactor/**
  pull_request:
    branches:
      - V1.3.x
      - feat/V1.3.0/Local
  workflow_dispatch:
    inputs:
      ref:
        description: '分支/标签/提交 SHA（默认 V1.3.x）'
        required: false
        default: 'V1.3.x'
        type: string
      java-version:
        description: 'JDK 版本'
        required: false
        default: '25'
        type: choice
        options:
          - '25'
          - '21'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ============================================================
  # 编译 + 单元测试
  # ============================================================
  build:
    name: Build & Test (JDK ${{ matrix.java-version }}, target 21)
    runs-on: ubuntu-latest

    # workflow_dispatch：使用手动选择的 JDK 版本（单值）
    # push / pull_request：矩阵并行测试 JDK 25（主）+ JDK 21
    matrix:
      java-version: ${{ github.event.inputs.java-version || '25' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      # ========================================================
      # 阶段一：编译（compile）
      # ========================================================
      - name: Compile
        run: >
          ./mvnw compile
          -Pdev
          -q
          --no-transfer-progress

      # ========================================================
      # 阶段二：单元测试（test）
      # ========================================================
      - name: Unit Tests
        run: >
          ./mvnw test
          -Pdev
          --no-transfer-progress
        env:
          JAVA_OPTS: -Xmx512m

      # ========================================================
      # 阶段三：打包（package），验证产物完整性
      # ========================================================
      - name: Package
        run: >
          ./mvnw package
          -Pdev
          -DskipTests
          --no-transfer-progress

      # ========================================================
      # 阶段四：上传测试报告（7 天保留）
      # ========================================================
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk${{ matrix.java-version }}
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

  # ============================================================
  # 代码质量卡点（静态检查）
  # workflow_dispatch 跳过以节省资源（手动触发时仅关注编译/测试结果）
  # ============================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # SpotBugs 静态分析
      - name: SpotBugs Static Analysis
        run: >
          ./mvnw spotbugs:check
          -Pdev
          --no-transfer-progress
        continue-on-error: true

      # 依赖分析
      - name: Dependency Analysis
        run: >
          ./mvnw dependency:analyze
          -Pdev
          --no-transfer-progress
        continue-on-error: true

      # 上报 commit status（辅助，不阻断合并）
      - name: Set commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const allPassed = true;
            const state = allPassed ? 'success' : 'failure';
            const description = allPassed
              ? 'All quality checks passed'
              : 'Quality gate finished (warnings allowed)';

            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: state,
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions`,
                description: description,
                context: 'ci/quality-gate'
              });
            } catch (e) {
              console.warn('Could not set commit status:', e.message);
            }

  # ============================================================
  # 构建产物（JDK 25 编译，字节码兼容 JDK 21）
  # 仅在 main 版本分支 push 时执行
  # ============================================================
  artifact:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'workflow_dispatch'
      || github.ref == 'refs/heads/V1.3.x'
      || github.ref == 'refs/heads/feat/V1.3.0/Local'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Artifacts
        run: >
          ./mvnw package
          -Pdev
          -DskipTests
          --no-transfer-progress

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autil-jars
          path: '**/target/*.jar'
          retention-days: 5

      - name: Upload source JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autil-sources
          path: '**/target/*-sources.jar'
          retention-days: 5
